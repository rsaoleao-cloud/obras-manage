<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Certifica Brasil - SP8 Tecnologia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a1a2a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 12px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }

    /* ── Imagem do flyer ── */
    .flyer-img {
      display: block;
      width: 100%;
      line-height: 0;
    }
    .flyer-img img {
      width: 100%;
      display: block;
    }

    /* ── Rodapé ── */
    .footer {
      background: #05293e;
    }

    /* Botão CTA */
    .btn-cta {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #2e8b2e 0%, #3a9e3a 50%, #2e8b2e 100%);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-align: center;
      padding: 16px 24px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      transition: filter 0.2s;
    }
    .btn-cta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 50%);
    }
    .btn-cta:active { filter: brightness(0.9); }
    .btn-cta .icon-cart {
      margin-right: 8px;
      font-size: 1.1rem;
    }

    /* Caixa de contato */
    .contact-box {
      margin: 10px 10px 10px 10px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      border-top: 5px solid #3a9e3a;
    }

    .contact-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      text-decoration: none;
      transition: background 0.15s;
    }
    .contact-row:first-of-type {
      border-bottom: 1px solid #cde0ef;
    }
    .contact-row:active {
      background: #f0f7ff;
    }

    .contact-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1rem;
      margin-right: 14px;
    }
    .icon-phone { background: #3a9e3a; }
    .icon-email { background: #05293e; }

    .contact-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #7fa0b8;
      margin-bottom: 2px;
    }
    .contact-value {
      font-weight: 800;
      color: #05293e;
      line-height: 1.1;
    }
    .contact-value.phone { font-size: 1.15rem; }
    .contact-value.email { font-size: 0.95rem; color: #2a5070; font-weight: 600; }

    .footer-bottom {
      text-align: center;
      padding: 8px;
      font-size: 0.65rem;
      color: #4a7a9a;
      letter-spacing: 0.5px;
    }
  </style>
</head>
